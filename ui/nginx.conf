# ============================================================
# CEBD 1261 — Session 08 | ui/nginx.conf
#
# KEY CHANGE FROM SESSION 07:
#   Session 07: proxy_pass http://agent_api:8893/
#               (Docker bridge network — containers talk by service name)
#
#   Session 08: proxy_pass http://localhost:8893/
#               (ACI Container Group — all containers share localhost)
# ============================================================

server {
    listen 80;
    root /usr/share/nginx/html;
    index chat.html;

    location / {
        try_files $uri $uri/ /chat.html;
    }

    location /api/ {
        proxy_pass         http://localhost:8893/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }
}