version: '3.8'

# ============================================================
# CEBD 1261 — Session 7 | Lab 1
#
# Services:
#   mongodb       — Document store            (port 27017)
#   elasticsearch — Search layer              (port 9200)
#   seeder        — Generates 10,000 orders → Mongo + ES (runs once)
#   agent_api     — FastAPI OOP agent backend (port 8893)
#   chat_ui       — nginx + Vue.js chat UI    (port 8080)
#
# Workflow:
#   1. Add your OPENAI_API_KEY to .env
#   2. docker compose up -d
#   3. Wait ~60s for seeder to finish (docker compose logs -f seeder)
#   4. Open http://localhost:8080
#
# API docs: http://localhost:8893/docs
# ============================================================

services:

  # ── MongoDB ──────────────────────────────────────────────────
  mongodb:
    image: mongo:latest
    container_name: mongodb
    hostname: mongodb
    ports:
      - "27015:27017"
    env_file:
      - .env
    volumes:
      - mongodb_data:/data/db
    networks:
      - lab1-net
    restart: unless-stopped
    command: --bind_ip_all
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── ElasticSearch ─────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 1g
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - lab1-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s

  # ── Data Seeder ───────────────────────────────────────────────
  # Generates 10,000 ecommerce orders and inserts into Mongo + ES.
  # Runs once and exits — does NOT restart.
  seeder:
    build:
      context: ./seeder
      dockerfile: Dockerfile
    container_name: seeder
    env_file:
      - .env
    networks:
      - lab1-net
    depends_on:
      mongodb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: "no"

  # ── Agent API (FastAPI) ───────────────────────────────────────
  agent_api:
    build:
      context: ./agent
      dockerfile: Dockerfile
      # dockerfile: Dockerfile.multistage # Uncomment to use multistage build (smaller image, longer build time), but you must comment previous line. as only dockerfile is allowed in build.
    container_name: agent_api
    env_file:
      - .env
    networks:
      - lab1-net
    ports:
      - "8893:8893"
    depends_on:
      mongodb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      seeder:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── Chat UI (nginx + Vue.js) ──────────────────────────────────
  chat_ui:
    image: nginx:alpine
    container_name: chat_ui
    ports:
      - "8080:80"
    volumes:
      - ./ui/chat.html:/usr/share/nginx/html/chat.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - lab1-net
    depends_on:
      - agent_api
    restart: unless-stopped

# ── Volumes ───────────────────────────────────────────────────
volumes:
  mongodb_data:
  es_data:

# ── Network ───────────────────────────────────────────────────
networks:
  lab1-net:
    driver: bridge
    name: agentic_network
