# ============================================================
# CEBD 1261 — Session 08 | GitHub Actions Deploy Workflow
# .github/workflows/deploy.yml
#
# TRIGGER: Push to main branch OR manual dispatch
#
# PIPELINE:
#   Job 1 — build-and-push
#     Step 1  Checkout code
#     Step 2  Login to Docker Hub
#     Step 3  Build seeder image    → push to Docker Hub
#     Step 4  Build agent_api image → push to Docker Hub
#     Step 5  Build chat_ui image   → push to Docker Hub
#
#   Job 2 — deploy  (runs after Job 1 succeeds)
#     Step 1  Checkout code
#     Step 2  Login to Azure using subscription ID
#     Step 3  Inject secrets into aci-group.yml
#     Step 4  Delete existing Container Group (if any)
#     Step 5  Deploy aci-group.yml → Azure ACI
#     Step 6  Print public URL
#
# REQUIRED GITHUB SECRETS:
#   AZURE_SUBSCRIPTION_ID    Your Azure for Students subscription ID
#   RESOURCE_GROUP           cebd1261-rg
#   DOCKERHUB_USERNAME       Your Docker Hub username
#   DOCKERHUB_TOKEN          Your Docker Hub access token
#   OPENROUTER_API_KEY       Your OpenRouter API key
#
# WHY DOCKER HUB INSTEAD OF ACR:
#   Azure for Students accounts managed by Concordia IT do not
#   have permission to create Service Principals or App
#   Registrations in Entra ID — required for ACR authentication.
#   Docker Hub is free and requires no Azure permissions.
# ============================================================

name: Build & Deploy to Azure ACI

on:
  push:
    branches:
      - main
  workflow_dispatch:

# ── Job 1: Build all images and push to Docker Hub ───────────
jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      # ── Step 1: Checkout ────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Step 2: Login to Docker Hub ─────────────────────────
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Step 3: Build & push seeder ─────────────────────────
      - name: Build and push seeder image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cebd1261-seeder:latest ./seeder
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cebd1261-seeder:latest

      # ── Step 4: Build & push agent_api ──────────────────────
      - name: Build and push agent_api image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cebd1261-agent:latest ./agent
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cebd1261-agent:latest

      # ── Step 5: Build & push chat_ui ────────────────────────
      # ui/Dockerfile bakes chat.html into the nginx image.
      # ACI cannot mount host volumes — the file must be in the image.
      - name: Build and push chat_ui image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cebd1261-ui:latest ./ui
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cebd1261-ui:latest

  # ── Job 2: Deploy Container Group to ACI ─────────────────────
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:

      # ── Step 1: Checkout ────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Step 2: Login to Azure ──────────────────────────────
      # Azure for Students accounts use az login with the
      # subscription ID directly — no Service Principal needed.
      - name: Login to Azure
        uses: azure/login@v2
        with:
          auth-type: IDENTITY
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── Step 3: Inject secrets into aci-group.yml ────────────
      # aci-group.yml uses __PLACEHOLDERS__ so secrets are never
      # committed to the repo. We replace them here at deploy time.
      - name: Inject secrets into ACI group definition
        run: |
          sed -i "s|__DOCKERHUB_USERNAME__|${{ secrets.DOCKERHUB_USERNAME }}|g" aci-group.yml
          sed -i "s|__OPENROUTER_API_KEY__|${{ secrets.OPENROUTER_API_KEY }}|g" aci-group.yml

      # ── Step 4: Delete old Container Group ──────────────────
      # ACI does not support in-place updates — must delete and
      # recreate on every deploy. || true prevents failure if the
      # group doesn't exist yet (first deploy).
      - name: Delete existing Container Group
        run: |
          az container delete \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --name cebd1261-group \
            --yes \
            || true

      # ── Step 5: Deploy Container Group ──────────────────────
      - name: Deploy to Azure Container Instances
        run: |
          az container create \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --file aci-group.yml \
            --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── Step 6: Print the public URL ────────────────────────
      - name: Print deployment URL
        run: |
          FQDN=$(az container show \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --name cebd1261-group \
            --query ipAddress.fqdn \
            --output tsv)
          echo "============================================"
          echo "  Chat UI : http://${FQDN}"
          echo "  API Docs: http://${FQDN}:8893/docs"
          echo "============================================"